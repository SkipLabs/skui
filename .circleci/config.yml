version: 2.1

commands:
  systemsetup:
    description: "Install used libraries"
    steps:
      - run:
          name: Install used libraries
          command: |
            apt-get update & apt-get -y install libpcre3 libpcre3-dev libnss3
  skdbsetup:
    description: "Setup skip toolchain"
    steps:
      - run:
          name: Fetch submodules
          command: |
            cd skdb && git submodule update --init --recursive
      - run:
          name: Build compiler
          command: |
            cd skdb/compiler && make STAGE=0 && make install STAGE=0
  sknpmsetup:
    description: "Setup sknpm toolchain"
    steps:
      - run:
          name: Build sknpm
          command: |
            cd skdb/sknpm && skargo b -r && cp target/host/release/sknpm /usr/local/bin/
  skuisetup:
    description: "Setup skui toolchain"
    steps:
      - run:
          name: Set skargo config
          command: |
            pwd
            printf "{\"repositories\": [\"skdb\", \"skui\"]}" > .skargoconfig
  cloneskdb:
    description: "Clone skdb"
    steps:
      - add_ssh_keys:
          fingerprints:
            - "a5:96:bf:61:22:02:b6:5c:d9:82:14:d7:9b:01:39:61"
      - run:
          name: Clone skdb
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git clone git@github.com:SkipLabs/skdb
  cloneskui:
    description: "Clone skui"
    steps:
      - add_ssh_keys:
          fingerprints:
            - "a5:96:bf:61:22:02:b6:5c:d9:82:14:d7:9b:01:39:61"
      - run:
          name: Clone skui
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git clone -b "$CIRCLE_BRANCH" "$CIRCLE_REPOSITORY_URL"

jobs:
  skui_common:
    docker:
      - image: skiplabs/skdb-base:latest
    steps:
      - systemsetup
      - cloneskdb
      - skdbsetup
      - cloneskui
      - skuisetup
      - run:
          name: Run common tests
          no_output_timeout: 2m
          command: |
            mkdir -p ~/test-results
            cd skui/skui_common && skargo test --junitxml ~/test-results/skui_common.xml
      - store_test_results:
          path: ~/test-results/skui_common.xml
  skui_font:
    docker:
      - image: skiplabs/skdb-base:latest
    resource_class: xlarge
    steps:
      - systemsetup
      - cloneskdb
      - skdbsetup
      - cloneskui
      - skuisetup
      - run:
          name: Run font tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui/skui_font && skargo test --junitxml ~/test-results/skui_font.xml
      - store_test_results:
          path: ~/test-results/skui_font.xml
  skui_mtsdf:
    docker:
      - image: skiplabs/skdb-base:latest
    steps:
      - systemsetup
      - cloneskdb
      - skdbsetup
      - cloneskui
      - skuisetup
      - run:
          name: Run mtsdf tests
          no_output_timeout: 2m
          command: |
            mkdir -p ~/test-results
            cd skui/skui_mtsdf && skargo test --junitxml ~/test-results/skui_mtsdf.xml
      - store_test_results:
          path: ~/test-results/skui_mtsdf.xml
  skui_common-wasm:
      docker:
        - image: skiplabs/skdb-base:latest
      steps:
      - systemsetup
      - cloneskdb
      - skdbsetup
      - sknpmsetup
      - cloneskui
      - skuisetup
      - run:
          name: Run font tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui/skui_font && skargo test --junitxml ~/test-results/skui_font.xml
      - run:
          name: Run wasm skui_common tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui/skui_common && sknpm test -r --junitxml ~/test-results/skui_common-wasm.xml
      - store_test_results:
          path: ~/test-results/skui_common-wasm.xml

workflows:
  common:
    jobs:
      - skui_common
  common-wasm:
    jobs:
      - skui_common-wasm
  font:
    jobs:
      - skui_font
  mtsdf:
    jobs:
      - skui_mtsdf
