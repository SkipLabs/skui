version: 2.1

commands:
  systemsetup:
    description: "Install used libraries"
    steps:
      - run:
          name: Install used libraries
          command: |
            apt-get update && apt-get install -y --no-install-recommends apt-utils && apt-get install -y libpcre3 libpcre3-dev libnss3 libssl-dev libx11-dev freeglut3-dev libglew-dev libxrandr-dev libxcursor-dev
  skipsetup:
    description: "Setup skip toolchain"
    steps:
      - run:
          name: Fetch submodules
          command: |
            cd skip && git submodule update --init --recursive
  cloneskip:
    description: "Clone skip"
    steps:
      - run:
          name: Clone skip
          command: |
            git clone https://github.com/SkipLabs/skip.git
  npmsetup:
    description: "Build npm chain"
    steps:
      - run:
          name: Build npm chain
          command: |
            npm i && npm run build && npx playwright install-deps && npx playwright install
jobs:
  skui_common:
    docker:
      - image: skiplabs/skdb-base:latest
    steps:
      - systemsetup
      - checkout
      - cloneskip
      - skipsetup
      - run:
          name: Run common tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui_common && skargo test --junitxml ~/test-results/skui_common.xml
      - store_test_results:
          path: ~/test-results/skui_common.xml
  skui_font:
    docker:
      - image: skiplabs/skdb-base:latest
    resource_class: xlarge
    steps:
      - systemsetup
      - checkout
      - cloneskip
      - skipsetup
      - run:
          name: Run font tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui_font && skargo test --junitxml ~/test-results/skui_font.xml
      - store_test_results:
          path: ~/test-results/skui_font.xml
  skui_mtsdf:
    docker:
      - image: skiplabs/skdb-base:latest
    steps:
      - systemsetup
      - checkout
      - cloneskip
      - skipsetup
      - run:
          name: Run mtsdf tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui_mtsdf && skargo test --junitxml ~/test-results/skui_mtsdf.xml
      - store_test_results:
          path: ~/test-results/skui_mtsdf.xml
  skui_views:
    docker:
      - image: skiplabs/skdb-base:latest
    steps:
      - systemsetup
      - checkout
      - cloneskip
      - skipsetup
      - run:
          name: Check skui_views
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui_views && skargo c
  skui_common-wasm:
    docker:
      - image: skiplabs/skdb-base:latest
    steps:
      - systemsetup
      - checkout
      - cloneskip
      - skipsetup
      - npmsetup
      - run:
          name: Run wasm skui_common tests
          environment:
            PLAYWRIGHT_JUNIT_OUTPUT_DIR: /root/test-results
            PLAYWRIGHT_JUNIT_OUTPUT_NAME: skui_common-wasm.xml
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui_common/ts/playwright && npm run test -- --reporter=junit
      - store_test_results:
          path: ~/test-results/skui_common-wasm.xml
  skui_font-wasm:
    docker:
      - image: skiplabs/skdb-base:latest
    steps:
      - systemsetup
      - checkout
      - cloneskip
      - skipsetup
      - npmsetup
      - run:
          name: Run wasm skui_font tests
          environment:
            PLAYWRIGHT_JUNIT_OUTPUT_DIR: /root/test-results
            PLAYWRIGHT_JUNIT_OUTPUT_NAME: skui_font-wasm.xml
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui_font/ts/playwright && npm run test -- --reporter=junit
      - store_test_results:
          path: ~/test-results/skui_font-wasm.xml
  skui_mtsdf-wasm:
    docker:
      - image: skiplabs/skdb-base:latest
    steps:
      - systemsetup
      - checkout
      - cloneskip
      - skipsetup
      - npmsetup
      - run:
          name: Run wasm skui_mtsdf tests
          environment:
            PLAYWRIGHT_JUNIT_OUTPUT_DIR: /root/test-results
            PLAYWRIGHT_JUNIT_OUTPUT_NAME: skui_mtsdf-wasm.xml
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui_mtsdf/ts/playwright && npm run test -- --reporter=junit
      - store_test_results:
          path: ~/test-results/skui_mtsdf-wasm.xml

workflows:
  common:
    jobs:
      - skui_common
  common-wasm:
    jobs:
      - skui_common-wasm
  font:
    jobs:
      - skui_font
  views:
    jobs:
      - skui_views
  font-wasm:
    jobs:
      - skui_font-wasm
  mtsdf:
    jobs:
      - skui_mtsdf
  mtsdf-wasm:
    jobs:
      - skui_mtsdf-wasm
