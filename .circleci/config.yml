version: 2.1

commands:
  skfssetup:
    description: "Setup skip toolchain"
    steps:
      - run:
          name: Fetch submodules
          command: |
            cd skfs && git submodule update --init --recursive
      - run:
          name: Build compiler
          command: |
            cd skfs/compiler && make STAGE=0 && make install STAGE=0
  sknpmsetup:
    description: "Setup sknpm toolchain"
    steps:
      - run:
          name: Build sknpm
          command: |
            cd skfs/sknpm && skargo b -r && cp target/host/release/sknpm /usr/local/bin/
  skuisetup:
    description: "Setup skui toolchain"
    steps:
      - run:
          name: Set skargo config
          command: |
            printf "{\"repositories\": [\"skfs\", \"skui\"]}" > .skargoconfig
  cloneskfs:
    description: "Clone skfs"
    steps:
      - add_ssh_keys:
          fingerprints:
            - "a5:96:bf:61:22:02:b6:5c:d9:82:14:d7:9b:01:39:61"
      - run:
          name: Clone skfs
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git clone git@github.com:SkipLabs/skfs
  cloneskui:
    description: "Clone skui"
    steps:
      - add_ssh_keys:
          fingerprints:
            - "a5:96:bf:61:22:02:b6:5c:d9:82:14:d7:9b:01:39:61"
      - run:
          name: Clone skui
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git clone -b "$CIRCLE_BRANCH" "$CIRCLE_REPOSITORY_URL"

jobs:
  skui_common:
    docker:
      - image: skiplabs/skdb-base:latest
    steps:
      - cloneskfs
      - skfssetup
      - cloneskui
      - run:
          name: Skip job if irrelevant
          command: |
            cd skui
            if git diff --quiet HEAD main -- skui_common/
            then
              circleci-agent step halt
            fi
      - skuisetup
      - run:
          name: Run common tests
          no_output_timeout: 2m
          command: |
            mkdir -p ~/test-results
            cd skui/skui_common && skargo test --junitxml ~/test-results/skui_common.xml
      - store_test_results:
          path: ~/test-results/skui_common.xml
  skui_font:
    docker:
      - image: skiplabs/skdb-base:latest
    resource_class: xlarge
    steps:
      - cloneskfs
      - skfssetup
      - cloneskui
      - run:
          name: Skip job if irrelevant
          command: |
            cd skui
            if git diff --quiet HEAD main -- skui_font/
            then
              circleci-agent step halt
            fi
      - skuisetup
      - run:
          name: Run font tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui/skui_font && skargo test --junitxml ~/test-results/skui_font.xml
      - store_test_results:
          path: ~/test-results/skui_font.xml
  skui_mtsdf:
    docker:
      - image: skiplabs/skdb-base:latest
    steps:
      - cloneskfs
      - skfssetup
      - cloneskui
      - run:
          name: Skip job if irrelevant
          command: |
            cd skui
            if git diff --quiet HEAD main -- skui_mtsdf/
            then
              circleci-agent step halt
            fi
      - skuisetup
      - run:
          name: Run mtsdf tests
          no_output_timeout: 2m
          command: |
            mkdir -p ~/test-results
            cd skui/skui_mtsdf && skargo test --junitxml ~/test-results/skui_mtsdf.xml
      - store_test_results:
          path: ~/test-results/skui_mtsdf.xml
  skui_common-wasm:
      docker:
        - image: skiplabs/skdb-base:latest
      steps:
      - cloneskfs
      - skfssetup
      - sknpmsetup
      - cloneskui
      - run:
          name: Skip job if irrelevant
          command: |
            cd skui
            if git diff --quiet HEAD main -- skui_common/
            then
              circleci-agent step halt
            fi
      - skuisetup
      - run:
          name: Run font tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui/skui_font && skargo test --junitxml ~/test-results/skui_font.xml
      - run:
          name: Run wasm skui_common tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui/skui_common && sknpm test -r --junitxml ~/test-results/skui_common-wasm.xml
      - store_test_results:
          path: ~/test-results/skui_common-wasm.xml

workflows:
  common:
    jobs:
      - skui_common
  common-wasm:
    jobs:
      - skui_common-wasm
  font:
    jobs:
      - skui_font
  mtsdf:
    jobs:
      - skui_mtsdf
