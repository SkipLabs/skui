version: 2.1

commands:
  skfssetup:
    description: "Setup skip toolchain"
    steps:
      - run:
          name: Fetch submodules
          command: |
            cd skfs && git submodule update --init --recursive
      - run:
          name: Build compiler
          command: |
            cd skfs/compiler && make STAGE=0 && sudo make install STAGE=0
  skuisetup:
    description: "Setup skui toolchain"
    steps:
      - run:
          name: Build and builder
          command: |
            printf "skfs\nskui\n" > .skargoreps
            cd skui/skui_build && make build
  cloneskfs:
    description: "Clone skfs"
    steps:
      - add_ssh_keys:
          fingerprints:
            - "a5:96:bf:61:22:02:b6:5c:d9:82:14:d7:9b:01:39:61"
      - run:
          name: Clone skfs
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git clone -b skuimerge git@github.com:SkipLabs/skfs
  cloneskui:
    description: "Clone skui"
    steps:
      - run:
          name: Clone skui
          command: |
            git clone -b "$CIRCLE_BRANCH" "$CIRCLE_REPOSITORY_URL"

jobs:
  skui_common:
    docker:
      - image: skiplabsdaniel/skui:circleci-0.0.1
    steps:
      - cloneskfs
      - skfssetup
      - cloneskui
      - run:
          name: Skip job if irrelevant
          command: |
            cd skui
            if git diff --quiet HEAD master -- skui_common/
            then
              circleci-agent step halt
            fi
      - skuisetup
      - run:
          name: Run common tests
          no_output_timeout: 2m
          command: |
            mkdir -p ~/test-results
            cd skui/skui_common && ../skui_build/target/skuibuild test --junitxml ~/test-results/skui_common.xml
      - store_test_results:
          path: ~/test-results/skui_common.xml
  skui_font:
    docker:
      - image: skiplabsdaniel/skui:circleci-0.0.1
    steps:
      - cloneskfs
      - skfssetup
      - cloneskui
      - run:
          name: Skip job if irrelevant
          command: |
            cd skui
            if git diff --quiet HEAD master -- skui_font/
            then
              circleci-agent step halt
            fi
      - skuisetup
      - run:
          name: Run common tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui/skui_font && ../skui_build/target/skuibuild test -v --junitxml ~/test-results/skui_font.xml
      - store_test_results:
          path: ~/test-results/skui_font.xml
  skui_mtsdf:
    docker:
      - image: skiplabsdaniel/skui:circleci-0.0.1
    steps:
      - cloneskfs
      - skfssetup
      - cloneskui
      - run:
          name: Skip job if irrelevant
          command: |
            cd skui
            if git diff --quiet HEAD master -- skui_mtsdf/
            then
              circleci-agent step halt
            fi
      - skuisetup
      - run:
          name: Run common tests
          no_output_timeout: 2m
          command: |
            mkdir -p ~/test-results
            cd skui/skui_mtsdf && ../skui_build/target/skuibuild test --junitxml ~/test-results/skui_mtsdf.xml
      - store_test_results:
          path: ~/test-results/skui_mtsdf.xml

workflows:
  common:
    jobs:
      - skui_common
  font:
    jobs:
      - skui_font
  mtsdf:
    jobs:
      - skui_mtsdf
