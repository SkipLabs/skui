version: 2.1

commands:
  systemsetup:
    description: "Install used libraries"
    steps:
      - run:
          name: Install used libraries
          command: |
            apt-get update && apt-get install -y --no-install-recommends apt-utils && apt-get install -y libpcre3 libpcre3-dev libnss3 libssl-dev
  skdbsetup:
    description: "Setup skip toolchain"
    steps:
      - run:
          name: Fetch submodules
          command: |
            cd dependencies/skdb && git submodule update --init --recursive
      - run:
          name: Build compiler
          command: |
            cd dependencies/skdb/compiler && make STAGE=0 && make install STAGE=0
  sknpmsetup:
    description: "Setup sknpm toolchain"
    steps:
      - run:
          name: Build sknpm
          command: |
            cd dependencies/skdb/sknpm && skargo b -r && cp target/host/release/sknpm /usr/local/bin/
  skuisetup:
    description: "Setup skui toolchain"
    steps:
      - run:
          name: Set skargo config
          command: |
            printf "{\"repositories\": [\"dependencies/skdb\"]}" > .skargoconfig
  cloneskdb:
    description: "Clone skdb"
    steps:
      - add_ssh_keys:
          fingerprints:
            - "a5:96:bf:61:22:02:b6:5c:d9:82:14:d7:9b:01:39:61"
      - run:
          name: Clone skdb
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git clone git@github.com:SkipLabs/skdb dependencies/skdb
jobs:
  skui_common:
    docker:
      - image: skiplabs/skdb-base:latest
    steps:
      - systemsetup
      - checkout
      - cloneskdb
      - skdbsetup
      - skuisetup
      - run:
          name: Run common tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui_common && skargo test --junitxml ~/test-results/skui_common.xml
      - store_test_results:
          path: ~/test-results/skui_common.xml
  skui_font:
    docker:
      - image: skiplabs/skdb-base:latest
    resource_class: xlarge
    steps:
      - systemsetup
      - checkout
      - cloneskdb
      - skdbsetup
      - skuisetup
      - run:
          name: Run font tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui_font && skargo test --junitxml ~/test-results/skui_font.xml
      - store_test_results:
          path: ~/test-results/skui_font.xml
  skui_mtsdf:
    docker:
      - image: skiplabs/skdb-base:latest
    steps:
      - systemsetup
      - checkout
      - cloneskdb
      - skdbsetup
      - skuisetup
      - run:
          name: Run mtsdf tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui_mtsdf && skargo test --junitxml ~/test-results/skui_mtsdf.xml
      - store_test_results:
          path: ~/test-results/skui_mtsdf.xml
  skui_common-wasm:
      docker:
        - image: skiplabs/skdb-base:latest
      steps:
      - systemsetup
      - checkout
      - cloneskdb
      - skdbsetup
      - sknpmsetup
      - skuisetup
      - run:
          name: Run wasm skui_common tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui_common && sknpm test -r --junitxml ~/test-results/skui_common-wasm.xml
      - store_test_results:
          path: ~/test-results/skui_common-wasm.xml
  skui_font-wasm:
      docker:
        - image: skiplabs/skdb-base:latest
      steps:
      - systemsetup
      - checkout
      - cloneskdb
      - skdbsetup
      - sknpmsetup
      - skuisetup
      - run:
          name: Run wasm skui_font tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui_font && sknpm test -r --junitxml ~/test-results/skui_font-wasm.xml
      - store_test_results:
          path: ~/test-results/skui_font-wasm.xml
  skui_mtsdf-wasm:
      docker:
        - image: skiplabs/skdb-base:latest
      steps:
      - systemsetup
      - checkout
      - cloneskdb
      - skdbsetup
      - sknpmsetup
      - skuisetup
      - run:
          name: Run wasm skui_mtsdf tests
          no_output_timeout: 5m
          command: |
            mkdir -p ~/test-results
            cd skui_mtsdf && sknpm test -r --junitxml ~/test-results/skui_mtsdf-wasm.xml
      - store_test_results:
          path: ~/test-results/skui_mtsdf-wasm.xml

workflows:
  common:
    jobs:
      - skui_common
  common-wasm:
    jobs:
      - skui_common-wasm
  font:
    jobs:
      - skui_font
  font-wasm:
    jobs:
      - skui_font-wasm
  mtsdf:
    jobs:
      - skui_mtsdf
  mtsdf-wasm:
    jobs:
      - skui_mtsdf-wasm
